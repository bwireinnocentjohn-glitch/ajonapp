name: Build Ajon APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Inject API keys
        env:
          GROQ_KEY:   ${{ secrets.GROQ_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'PY'
          import io, os
          p = 'www/index.html'
          html = io.open(p, encoding='utf-8').read()
          g = os.environ.get('GROQ_KEY', '')
          m = os.environ.get('GEMINI_KEY', '')
          if not g or not m:
              raise SystemExit('ERROR: one or both secrets missing')
          g_before = html.count('PASTE_YOUR_GROQ_KEY_HERE')
          m_before = html.count('PASTE_YOUR_GEMINI_KEY_HERE')
          html = html.replace('PASTE_YOUR_GROQ_KEY_HERE', g)
          html = html.replace('PASTE_YOUR_GEMINI_KEY_HERE', m)
          io.open(p, 'w', encoding='utf-8').write(html)
          print('Groq placeholder found: %d' % g_before)
          print('Gemini placeholder found: %d' % m_before)
          if g_before == 0 or m_before == 0:
              raise SystemExit('ERROR: placeholder missing')
          print('Keys injected OK.')
          PY

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Inject microphone permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          python3 - << 'PY'
          import io
          p = 'android/app/src/main/AndroidManifest.xml'
          s = io.open(p, encoding='utf-8').read()
          add = ''
          if 'android.permission.RECORD_AUDIO' not in s:
              add += '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if 'android.permission.MODIFY_AUDIO_SETTINGS' not in s:
              add += '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n'
          if add:
              s = s.replace('<application', add + '    <application', 1)
              io.open(p, 'w', encoding='utf-8').write(s)
              print('Permissions injected')
          else:
              print('Permissions already present')
          PY
          echo "--- manifest head ---"
          head -20 android/app/src/main/AndroidManifest.xml

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Generate app icons
        run: npx --yes @capacitor/assets generate --android --assetPath resources || echo "icon assets skipped"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ajon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
