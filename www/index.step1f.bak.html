<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;overscroll-behavior:none;}
input,textarea{user-select:text;-webkit-user-select:text;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;background:#0a0a0a;position:relative;overflow:hidden;}
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px;background:#0a0a0a;border-bottom:1px solid rgba(0,200,83,.35);position:relative;z-index:5;padding-top:calc(12px + env(safe-area-inset-top));}
.logo-mark{font-size:24px;line-height:1;filter:drop-shadow(0 0 8px rgba(0,200,83,.6));}
.logo{font-size:22px;font-weight:900;color:#00c853;letter-spacing:2px;line-height:1;text-shadow:0 0 14px rgba(0,200,83,.45);}
.sub{font-size:10.5px;color:#8f8f8f;letter-spacing:.4px;margin-top:3px;font-weight:600;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.user-badge{display:flex;align-items:center;gap:4px;background:linear-gradient(135deg,#003d14,#001f0a);border:1px solid rgba(0,200,83,.5);border-radius:999px;padding:4px 9px;font-size:10.5px;font-weight:800;color:#00c853;letter-spacing:.3px;white-space:nowrap;}
.user-badge .pulse{width:5px;height:5px;background:#00c853;border-radius:50%;animation:userPulse 1.6s ease-in-out infinite;}
@keyframes userPulse{0%,100%{opacity:.4;transform:scale(.85);}50%{opacity:1;transform:scale(1.2);}}
.netdot{width:10px;height:10px;border-radius:50%;background:#ff3d00;transition:.3s;}
.netdot.on{background:#00c853;}
nav.tabs{flex:0 0 auto;display:flex;gap:1px;background:#0a0a0a;border-bottom:1px solid #00c853;padding:6px 3px;position:relative;z-index:6;}
.tab-btn{flex:1;background:transparent;border:0;color:#8a8a8a;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px;border-radius:11px;font-size:8.5px;font-weight:700;cursor:pointer;min-width:0;}
.tab-btn .ico{font-size:17px;line-height:1;}
.tab-btn.active{background:#00c853;color:#000;}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;}
.panel{display:none;padding-bottom:24px;animation:fade .25s ease;}
.panel.active{display:block;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.search{position:sticky;top:0;z-index:8;background:#0a0a0a;padding:12px 16px 8px;}
.search input{width:100%;padding:12px 14px;border-radius:12px;background:#1a1a1a;color:#fff;border:1px solid #00c853;font-size:14px;font-family:inherit;outline:none;}
.search input::placeholder{color:#7a7a7a;}
.search .count{font-size:11.5px;color:#8f8f8f;margin-top:8px;padding-left:2px;font-weight:600;}
.cat-bar{display:flex;gap:8px;padding:8px 16px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.cat-bar::-webkit-scrollbar{display:none;}
.cat-chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:#1a1a1a;border:1px solid rgba(0,200,83,.4);color:#c8c8c8;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;}
.cat-chip.active{background:#00c853;color:#000;border-color:#00c853;}
.card{background:#1a1a1a;border-left:4px solid #00c853;border-radius:12px;padding:14px;margin:12px 16px;box-shadow:0 6px 18px rgba(0,0,0,.55);animation:slideUp .35s ease both;}
.card.locked{border-left-color:#444;opacity:.75;}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.imgwrap{position:relative;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#0f2a17,#1a1a1a);height:160px;margin-bottom:12px;}
.emoji-hero{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:78px;line-height:1;filter:drop-shadow(0 0 12px rgba(0,200,83,.35));}
.tut-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;}
.badge{position:absolute;top:10px;right:10px;background:#00c853;color:#000;font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;box-shadow:0 2px 10px rgba(0,200,83,.5);z-index:3;}
.badge.lock{background:#444;color:#ddd;}
.fav{position:absolute;bottom:10px;right:10px;width:38px;height:38px;background:rgba(0,0,0,.62);border:0;border-radius:50%;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;}
.fav.pop{animation:pop .45s ease;}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}70%{transform:scale(.85)}100%{transform:scale(1)}}
.card-title{font-size:16px;font-weight:800;margin:4px 0 8px;color:#fff;}
.chip{display:inline-block;font-size:11px;font-weight:700;color:#00c853;background:rgba(0,200,83,.12);border:1px solid rgba(0,200,83,.4);padding:3px 9px;border-radius:999px;margin-bottom:10px;}
.cost{font-size:12.5px;color:#b5b5b5;font-weight:600;display:block;margin-bottom:4px;}
.profit{background:#003d14;color:#00c853;border-radius:12px;padding:11px 13px;font-weight:800;font-size:14px;margin:10px 0;border:1px solid rgba(0,200,83,.35);}
.btn{display:block;width:100%;background:linear-gradient(135deg,#00c853,#009624);color:#fff;font-weight:700;font-size:15px;border:0;border-radius:12px;padding:13px 18px;font-family:inherit;cursor:pointer;box-shadow:0 6px 16px rgba(0,200,83,.25);}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.45;box-shadow:none;}
.btn.grey{background:linear-gradient(135deg,#555,#333);box-shadow:none;}
.dolist,.dontlist{margin:10px 0;border-radius:12px;padding:10px 12px;background:#111;}
.dolist{border-left:4px solid #00c853;}
.dontlist{border-left:4px solid #ff3d00;}
.dolist h4,.dontlist h4{font-size:13px;margin-bottom:6px;letter-spacing:.5px;}
.dolist h4{color:#00c853;}
.dontlist h4{color:#ff3d00;}
.dolist ul,.dontlist ul{list-style:none;}
.dolist li,.dontlist li{font-size:13.5px;color:#dcdcdc;padding:4px 0 4px 18px;position:relative;}
.dolist li:before{content:"✔";position:absolute;left:0;top:4px;color:#00c853;font-size:11px;}
.dontlist li:before{content:"✖";position:absolute;left:0;top:4px;color:#ff3d00;font-size:11px;}
.failbox{background:#1a1a1a;border-left:4px solid #ff3d00;border-radius:12px;padding:11px 13px;font-size:13px;color:#e6e6e6;margin:10px 0;}
.failbox strong{color:#ff3d00;display:block;margin-bottom:6px;font-size:12.5px;letter-spacing:.4px;}
.fail-item{font-size:12.5px;color:#dcdcdc;margin-bottom:6px;padding-left:14px;position:relative;}
.fail-item:before{content:"→";position:absolute;left:0;color:#00c853;}
.fail-item strong{display:inline;color:#ff3d00;margin:0;}
.muted{color:#8f8f8f;font-size:12.5px;}
.note{background:#003d14;color:#00c853;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:10px;font-weight:600;line-height:1.5;}
.empty{text-align:center;padding:40px 24px;color:#9a9a9a;font-size:14px;}
.empty .bigicon{font-size:46px;margin-bottom:12px;line-height:1;}
.empty h3{color:#fff;font-size:17px;margin-bottom:6px;font-weight:800;}
.typing{display:flex;gap:6px;align-items:center;padding:6px 0;}
.typing span{width:10px;height:10px;border-radius:50%;background:#00c853;display:inline-block;animation:bounce 1.4s infinite ease-in-out;}
.typing span:nth-child(2){animation-delay:.18s;}
.typing span:nth-child(3){animation-delay:.36s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45;}30%{transform:translateY(-8px);opacity:1;}}
.typing-label{font-size:12.5px;color:#00c853;font-weight:700;margin-top:4px;}
.typed{font-size:14px;color:#dcdcdc;min-height:22px;white-space:pre-wrap;}
.typed.cursor::after{content:"▍";color:#00c853;margin-left:1px;animation:blink .7s steps(1,end) infinite;}
@keyframes blink{50%{opacity:0;}}
.ai-top{display:flex;align-items:center;gap:8px;padding:12px 16px 0;flex-wrap:wrap;}
.status-pill{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(0,200,83,.12);color:#00c853;border:1px solid rgba(0,200,83,.4);}
.brain-pill{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:linear-gradient(135deg,#00c853,#009624);color:#000;border:1px solid #00c853;}
.ai-input-row{padding:12px 16px 8px;}

.ai-btn-row{padding:0 16px;}

.notes-editor input,.notes-editor textarea{width:100%;background:#1a1a1a;color:#fff;border:1px solid #00c853;border-radius:12px;padding:12px 14px;font-family:inherit;font-size:14px;outline:none;margin-bottom:10px;}
.notes-editor textarea{min-height:110px;resize:vertical;line-height:1.5;}
.notes-editor input::placeholder,.notes-editor textarea::placeholder{color:#7a7a7a;}
.notes-list{padding:6px 16px 20px;}

.note-item .date{font-size:11px;color:#7a7a7a;margin-bottom:6px;font-weight:600;}
.note-item p{font-size:13px;color:#dcdcdc;white-space:pre-wrap;word-break:break-word;}
.note-delete{position:absolute;top:12px;right:12px;background:rgba(255,61,0,.15);color:#ff3d00;border:1px solid rgba(255,61,0,.4);border-radius:8px;padding:5px 9px;font-size:11px;font-weight:800;cursor:pointer;}

.note-modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:20px;}

#detailSheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;background:#0a0a0a;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:none;}
#detailSheet.open{transform:translateY(0);pointer-events:auto;}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;background:rgba(10,10,10,.96);padding:12px 16px;border-bottom:1px solid rgba(0,200,83,.35);}
.back-btn{width:36px;height:36px;border-radius:10px;flex:0 0 auto;background:#1a1a1a;border:1px solid rgba(0,200,83,.4);color:#00c853;font-size:16px;cursor:pointer;}
.sheet-title{font-size:14.5px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.speak-btn{width:38px;height:38px;border-radius:10px;flex:0 0 auto;background:linear-gradient(135deg,#00c853,#009624);border:0;color:#fff;font-size:16px;cursor:pointer;}

.sheet-body{padding:14px 16px 40px;}

.mat-item{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed rgba(0,200,83,.15);font-size:12.5px;}

.mat-item .mi-cost{color:#00c853;font-weight:700;white-space:nowrap;}
.mat-item .mi-where{color:#8f8f8f;font-size:11px;display:block;margin-top:1px;}
.market-box{background:#0a1a0e;border-left:3px solid #00c853;border-radius:10px;padding:10px 12px;margin:8px 0;}
.market-box h4{color:#00c853;font-size:12px;letter-spacing:.5px;margin-bottom:6px;font-weight:800;}
.market-item{font-size:12.5px;color:#dcdcdc;padding:5px 0;border-bottom:1px dashed rgba(0,200,83,.15);}
.market-item:last-child{border-bottom:0;}
.market-item strong{color:#00c853;display:block;font-size:11.5px;margin-bottom:2px;}
.start-today{background:linear-gradient(135deg,#003d14,#001f0a);border:1px solid #00c853;border-radius:12px;padding:12px;margin:12px 0;color:#00c853;font-size:13px;font-weight:700;line-height:1.5;}
.start-today strong{display:block;font-size:11.5px;letter-spacing:.5px;margin-bottom:4px;opacity:.85;}
.free-bar{background:linear-gradient(135deg,#003d14,#001f0a);border-radius:12px;padding:12px;margin:0 16px 12px;border:1px solid rgba(0,200,83,.4);text-align:center;font-size:12.5px;color:#00c853;font-weight:700;line-height:1.5;}

.trial-bar .time{font-weight:900;font-size:14px;letter-spacing:1px;}
.creator-card{background:linear-gradient(135deg,#0f2a17,#1a1a1a);border-left:4px solid #00c853;border-radius:12px;padding:18px 16px;margin:12px 16px 24px;text-align:center;}

.creator-card .creator-tel{display:inline-block;font-size:13.5px;color:#00c853;font-weight:800;letter-spacing:.5px;margin:6px 0 12px;text-decoration:none;background:rgba(0,200,83,.1);padding:8px 14px;border-radius:999px;border:1px solid rgba(0,200,83,.4);}

.creator-card .creator-copy{font-size:10.5px;color:#7a7a7a;letter-spacing:.4px;font-weight:600;}
.creator-card .creator-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,200,83,.4),transparent);margin:12px 0;}
.paywall-wrap{padding:16px;display:flex;flex-direction:column;align-items:center;}

.paywall-title{font-size:22px;font-weight:900;color:#00c853;letter-spacing:.4px;margin-bottom:8px;}
.paywall-lock{font-size:46px;line-height:1;margin-bottom:8px;}
.paywall-sub{font-size:12.5px;color:#8f8f8f;margin-bottom:16px;letter-spacing:.4px;font-weight:600;}
.paywall-instructions{background:linear-gradient(135deg,#001a0a,#003d14);border:1px solid rgba(0,200,83,.35);border-radius:12px;padding:14px 12px;text-align:left;margin-bottom:16px;font-size:13px;color:#e6e6e6;line-height:1.7;}
.paywall-instructions .line{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;}
.paywall-instructions .line:last-child{margin-bottom:0;}
.paywall-instructions .ic{color:#00c853;font-weight:900;flex:0 0 auto;}

.paywall-instructions .num{color:#fff;font-weight:800;letter-spacing:.5px;}
.paywall-hint{font-size:11.5px;color:#7a7a7a;margin-top:-6px;margin-bottom:14px;font-weight:600;line-height:1.5;}

var AUTO_IMAGES = true;
var IMAGE_MAP = {};

function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9\s-]/g, "").replace(/\s+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
}
function imagePathFor(t) {
  if (t.img) return t.img;
  if (IMAGE_MAP[t.t]) return IMAGE_MAP[t.t];
  if (AUTO_IMAGES) return "images/" + slugify(t.t) + ".webp";
  return null;
}
function onImgError(img) {
  try {
    var emoji = img.getAttribute("data-emoji") || "💰";
    var div = document.createElement("div");
    div.className = "emoji-hero";
    div.textContent = emoji;
    img.parentNode.replaceChild(div, img);
  } catch (e) {}
}
function imgHTML(t) {
  var src = imagePathFor(t);
  var emoji = t.emoji || "💰";
  if (src) {
    return '<div class="emoji-hero">' + emoji + '</div>' +
           '<img class="tut-img" src="' + src + '" alt="" loading="lazy" data-emoji="' + emoji + '" onerror="onImgError(this)">';

}

  return ("aj" + Num + L1 + L2 + L3 + L4 + Last).toLowerCase();

/* ===================================================================
   EXPAND RAW DATA INTO TUTORIAL OBJECTS
   =================================================================== */
function expandBusiness(raw, index) {
  var id = index + 1;
  function split(s) { return s ? s.split("||") : []; }
  function splitPipe(s) { return s ? s.split("|") : []; }
  function splitTilde(s, n) {
    var parts = s.split("~");
    while (parts.length < n) parts.push("");
    return parts;
  }
  var matArr = splitPipe(raw[9]).map(function(m) {
    var p = splitTilde(m, 3);
    return { item: p[0], cost: p[1], where: p[2] };
  });
  var failsArr = splitPipe(raw[14]).map(function(f) {
    var p = splitTilde(f, 2);
    return { problem: p[0], fix: p[1] };
  });
  var marketArr = splitPipe(raw[15]).map(function(m) {
    var p = splitTilde(m, 2);
    return { channel: p[0], detail: p[1] };
  });
  return {
    id: id,
    t: raw[0],
    emoji: raw[1],
    c: raw[2],
    cost: raw[3],
    sales: raw[4],
    profit: Number(raw[4]) - Number(raw[3]),
    time: raw[5],
    buy: raw[6],
    sell: raw[7],
    tagline: raw[8],
    materials: matArr,
    tools: splitPipe(raw[10]),
    steps: split(raw[11]),
    dos: splitPipe(raw[12]),
    donts: splitPipe(raw[13]),
    fails: failsArr,
    market: marketArr,
    startToday: raw[16]
  };
}

var ALL_BUSINESSES = RAW_BUSINESSES.map(expandBusiness);

var USER_BASE = 208400, USER_START = 1000;
var userCount = readJSON(LS_USERS, USER_START);
if (userCount < USER_START) userCount = USER_START;
var userTickTimer = null;

function readJSON(key, fb) { try { var r = localStorage.getItem(key); if (!r) return fb; var v = JSON.parse(r); return (v == null) ? fb : v; } catch (e) { return fb; } }
function writeJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
function fmt(n) { n = Number(n) || 0; try { return n.toLocaleString("en-US"); } catch (e) { return String(n); } }
function escapeHTML(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function byId(id) { return document.getElementById(id); }
function formatDate(ts) { try { var d = new Date(ts); return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } }
function formatDateShort(ts) { try { var d = new Date(ts); return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); } catch (e) { return ""; } }
function formatUserCount(n) { n = Number(n) || 0; if (n >= 1000000) return (n / 1000000).toFixed(2) + "M"; if (n >= 1000) return (n / 1000).toFixed(1) + "k"; return String(n); }

/* ===================== LIVE USER COUNTER ===================== */
function animateUserCount() {
  var el = byId("userBadge"); if (!el) return;
  if (userCount >= USER_BASE) { el.textContent = formatUserCount(userCount); startUserTick(); return; }
  var from = Math.max(USER_START, userCount), to = USER_BASE, startTime = Date.now(), duration = 2600;
  function step() {
    var t = Math.min((Date.now() - startTime) / duration, 1); t = 1 - Math.pow(1 - t, 3);
    var current = Math.floor(from + (to - from) * t); el.textContent = formatUserCount(current); userCount = current;
    if (t < 1) requestAnimationFrame(step);
    else { userCount = USER_BASE; writeJSON(LS_USERS, userCount); el.textContent = formatUserCount(userCount); startUserTick(); }
  }
  requestAnimationFrame(step);
}
function startUserTick() {
  if (userTickTimer) clearInterval(userTickTimer);
  userTickTimer = setInterval(function () {
    userCount += Math.floor(Math.random() * 5) + 1;
    var el = byId("userBadge"); if (el) el.textContent = formatUserCount(userCount);
    if (Math.random() < 0.12) writeJSON(LS_USERS, userCount);
  }, 2800);
}

/* ===================== TRIAL ===================== */
function trialMinutesLeft() { var trialMs = (appConfig.trialMinutes || 5) * 60 * 1000; return Math.max(0, trialMs - (Date.now() - installTime)); }
function isTrialActive() { return trialMinutesLeft() > 0; }
function isSubscribed() { return subscriptionEndDate && subscriptionEndDate > Date.now(); }
function hasFullAccess() { return isSubscribed() || isTrialActive(); }
function canAccess(tut) { if (hasFullAccess()) return true; return Number(tut.id) <= 2; }
function formatTrialTime(ms) { var s = Math.ceil(ms / 1000); var m = Math.floor(s / 60); var sec = s % 60; return m + ":" + (sec < 10 ? "0" : "") + sec; }
function updateTrialBar() {
  var bar = byId("trialBar"); if (!bar) return;
  if (isSubscribed()) { var daysLeft = Math.ceil((subscriptionEndDate - Date.now()) / (1000 * 60 * 60 * 24)); bar.innerHTML = '<div class="trial-bar">✅ Full access — ' + daysLeft + ' days remaining</div>'; return; }
  if (isTrialActive()) { bar.innerHTML = '<div class="trial-bar">🎁 Free preview: <span class="time">' + formatTrialTime(trialMinutesLeft()) + '</span> — enjoy all tutorials</div>'; return; }
  bar.innerHTML = '<div class="trial-bar">🔒 Preview ended — Unlock 500+ ideas in the Unlock tab</div>';
}
function startTrialTick() {
  if (trialTickTimer) clearInterval(trialTickTimer);
  trialTickTimer = setInterval(function () { updateTrialBar(); if (!isTrialActive() && !isSubscribed()) { tutOffset = 0; renderTutorials(true); } }, 1000);
}

/* ===================== LAZY LOADING ===================== */
function setupObserver() {
  if (observer) observer.disconnect();
  var sentinel = byId("loadSentinel");
  if (!sentinel) return;
  observer = new IntersectionObserver(function (entries) {
    if (entries[0].isIntersecting && !loadingMore && tutOffset < currentItems.length) {

function pickFresh(arr, lastArr, windowSize) {
  windowSize = windowSize || 20;
  var recent = lastArr.slice(-windowSize);
  var candidates = arr.filter(function (x) { return recent.indexOf(x) === -1; });
  if (!candidates.length) candidates = arr;
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function nextTopic(currentTopic) {
  var chain = BRAIN_TOPIC_CHAINS[currentTopic];
  if (!chain || !chain.length) chain = Object.keys(BRAIN_TOPIC_CHAINS);
  var recent = BRAIN.lastTopics.slice(-6);
  var candidates = chain.filter(function (x) { return recent.indexOf(x) === -1; });
  if (!candidates.length) candidates = chain;
  var next = candidates[Math.floor(Math.random() * candidates.length)];
  BRAIN.lastTopics.push(next);
  if (BRAIN.lastTopics.length > 60) BRAIN.lastTopics = BRAIN.lastTopics.slice(-60);
  return next;
}

function computeLevel() {
  var c = BRAIN.chatCount;
  if (c >= 301) return 6;
  if (c >= 151) return 5;
  if (c >= 81) return 4;
  if (c >= 41) return 3;
  if (c >= 16) return 2;
  return 1;
}

function growCapital() {
  var inc = Math.floor(Math.random() * 8000) + 1500;
  BRAIN.capital += inc;
  if (BRAIN.capital > 100000000) BRAIN.capital = 100000000;
}

function pickEmotion() { return BRAIN_EMOTIONS[Math.floor(Math.random() * BRAIN_EMOTIONS.length)]; }

function generateBusinessIdea() {
  var attempts = 0;
  while (attempts < 30) {
    var problem = pickFresh(BRAIN_PROBLEMS, BRAIN.lastIdeas, 40);
    var skill = BRAIN_SKILLS[Math.floor(Math.random() * BRAIN_SKILLS.length)];
    var location = BRAIN_LOCATIONS[Math.floor(Math.random() * BRAIN_LOCATIONS.length)];
    var trend = BRAIN_TRENDS[Math.floor(Math.random() * BRAIN_TRENDS.length)];
    var cap = Math.max(30000, Math.floor(BRAIN.capital * 0.4 / 1000) * 1000);
    var hash = problem + "|" + location + "|" + trend;
    if (BRAIN.usedIdeaHashes[hash]) { attempts++; continue; }
    BRAIN.usedIdeaHashes[hash] = 1;
    BRAIN.lastIdeas.push(problem);
    if (BRAIN.lastIdeas.length > 100) BRAIN.lastIdeas = BRAIN.lastIdeas.slice(-100);
    return { name: problem, location: location, skill: skill, capital: cap, trend: trend };
  }
  return null;
}

function playNotifySound() {
  if (!assistSoundOn) return;
  try {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.setValueAtTime(1245, now + 0.08);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.30);
    osc.start(now);
    osc.stop(now + 0.32);
  } catch (e) {}
}

function forceShortChunks(text, maxLen) {
  maxLen = maxLen || 65;
  var out = [];
  var blocks = String(text || "").split(/\n+/);
  for (var b = 0; b < blocks.length; b++) {
    var block = blocks[b].trim();
    if (!block) continue;
    if (block.length <= maxLen) { out.push(block); continue; }
    var sentences = block.match(/[^.!?]+[.!?]+/g) || [block];
    for (var s = 0; s < sentences.length; s++) {
      var sen = sentences[s].trim();
      if (!sen) continue;
      if (sen.length <= maxLen) { out.push(sen); continue; }
      var words = sen.split(/\s+/);
      var cur = "";
      for (var w = 0; w < words.length; w++) {
        if (!cur) { cur = words[w]; continue; }
        if ((cur + " " + words[w]).length <= maxLen) cur += " " + words[w];
        else { out.push(cur); cur = words[w]; }
      }
      if (cur) out.push(cur);
    }
  }
  return out;
}

function chunkV4(text, maxLen) {
  maxLen = maxLen || 55;
  var t = String(text || "");
  var paragraphs = t.split(/\n+/);
  var out = [];
  for (var p = 0; p < paragraphs.length; p++) {
    var block = paragraphs[p].replace(/\s+/g, " ").trim();
    if (!block) continue;
    if (block.length <= maxLen) { out.push(block); continue; }
    var words = block.split(" ");
    var cur = "";
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      if (!cur) { cur = w; continue; }
      if ((cur + " " + w).length <= maxLen) cur += " " + w;
      else { out.push(cur); cur = w; }
    }
    if (cur) out.push(cur);
  }
  return out;
}

  out.push(shortDiag(topic));

  var principle = pickFresh(BRAIN_PRINCIPLES, BRAIN.lastPrinciples, 25);
  BRAIN.lastPrinciples.push(principle);
  if (BRAIN.lastPrinciples.length > 60) BRAIN.lastPrinciples = BRAIN.lastPrinciples.slice(-60);
  out.push("Principle: " + principle);

  var storyStr = pickFresh(BRAIN_STORIES.map(function(s){return JSON.stringify(s);}), BRAIN.lastStories, 8);
  var story = JSON.parse(storyStr);
  BRAIN.lastStories.push(storyStr);
  if (BRAIN.lastStories.length > 40) BRAIN.lastStories = BRAIN.lastStories.slice(-40);
  out.push("Year " + story.y + ", " + story.p + ", " + story.a + " UGX. " + story.l);

  if (BRAIN.chatCount % 4 === 3) {
    var termName = pickFresh(BRAIN_BUSINESS_TERMS.map(function(x){return x.t;}), BRAIN.lastTerms, 15);
    for (var ti = 0; ti < BRAIN_BUSINESS_TERMS.length; ti++) {
      if (BRAIN_BUSINESS_TERMS[ti].t === termName) {
        var def = BRAIN_BUSINESS_TERMS[ti].d;
        var dot = def.indexOf(". ");
        if (dot > 0) def = def.substring(0, dot + 1);
        out.push("Term: " + termName + ". " + def);
        BRAIN.lastTerms.push(termName);
        if (BRAIN.lastTerms.length > 30) BRAIN.lastTerms = BRAIN.lastTerms.slice(-30);
        break;
      }
    }
  }

  if (BRAIN.chatCount % 3 === 2) {
    var idea = generateBusinessIdea();
    if (idea) {
      out.push("Idea: " + idea.name + " in " + idea.location + ".");
      out.push("Capital: " + fmt(idea.capital) + " UGX. Skill: " + idea.skill + ".");
    }
  }

  if (BRAIN.chatCount % 5 === 4 && typeof ALL_BUSINESSES !== "undefined" && ALL_BUSINESSES.length) {
    var idx = Math.floor(Math.random() * ALL_BUSINESSES.length);
    var b = ALL_BUSINESSES[idx];
    out.push("Study: " + b.t + ". Start " + fmt(b.cost) + " UGX, profit " + fmt(b.profit) + ".");
  }

  if (BRAIN.chatCount % 4 === 1) {
    var fact = pickFresh(BRAIN_FUNNY_FACTS, BRAIN.lastFacts, 15);
    BRAIN.lastFacts.push(fact);
    if (BRAIN.lastFacts.length > 30) BRAIN.lastFacts = BRAIN.lastFacts.slice(-30);
    out.push("Fun fact: " + fact);
  }

  out.push(SHORT_ACTIONS[Math.floor(Math.random() * SHORT_ACTIONS.length)]);
  out.push("Tonight count cash. Cost vs profit.");

  var proverb = pickFresh(BRAIN_PROVERBS, BRAIN.lastProverbs, 20);
  BRAIN.lastProverbs.push(proverb);
  if (BRAIN.lastProverbs.length > 40) BRAIN.lastProverbs = BRAIN.lastProverbs.slice(-40);
  out.push(proverb);

  out.push("What will you finish before 6pm?");
  return out;
}

</script>
